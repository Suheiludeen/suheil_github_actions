name: testing
on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: python-Version
      uses: actions/setup-python@v3
      with:  
        python-version: '3.11-slim'
    - name: build install
      run: pip install pytest
    - name: test
      run: python pytest
    - name: docker image build
      run: docker build -t suheil210/suheil_github:testv1
    - name: docker login
      uses: docker/login-action@v3
      with: 
        username: ${{vars.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PASSWORD}}
    - name: docker pushing
      run: docker push suheil210/suheil_github:testv1


    


